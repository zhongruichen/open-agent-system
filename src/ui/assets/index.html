<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多智能体任务状态</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <h1>多智能体助手</h1>

    <div class="tabs">
        <button class="tab-button active" data-tab="status">任务状态</button>
        <button class="tab-button" data-tab="settings">设置</button>
    </div>

    <div id="status" class="tab-content active">
        <div class="container">
            <div class="section">
                <h2>总体目标</h2>
                <p id="overall-goal">等待任务开始...</p>
            </div>

            <div class="section">
                <h2>当前计划</h2>
                <ul id="plan-list">
                    <!-- 计划步骤将在此处动态插入 -->
                </ul>
            </div>

            <div class="section">
                <h2>执行日志</h2>
                <div id="execution-log" class="log-box">
                    <!-- 日志消息将在此处动态插入 -->
                </div>
            </div>

            <div class="section">
                <h2>最终产物</h2>
                <pre id="final-artifact" class="code-box">
                    <code><!-- 最终代码/产物将在此处显示 --></code>
                </pre>
            </div>
        </div>
    </div>

    <div id="settings" class="tab-content">
        <div class="container">
            <h2>模型配置</h2>
            <div id="models-list">
                <!-- 模型列表将在此处动态生成 -->
            </div>
            <button id="add-model-btn" class="button">添加新模型</button>
        </div>

        <div id="model-editor" class="container" style="display: none;">
            <h3 id="editor-title">添加模型</h3>
            <form id="model-form">
                <input type="hidden" id="model-id" value="">

                <label for="model-name">名称:</label>
                <input type="text" id="model-name" required>

                <label for="model-provider">供应商:</label>
                <select id="model-provider" required>
                    <option value="OpenAI">OpenAI</option>
                    <option value="Anthropic">Anthropic</option>
                    <option value="Google">Google</option>
                    <option value="Custom">Custom</option>
                </select>

                <label for="model-modelName">模型名称 (e.g., gpt-4-turbo):</label>
                <input type="text" id="model-modelName" required>

                <label for="model-apiKey">API Key:</label>
                <input type="password" id="model-apiKey" required>

                <label for="model-baseUrl">Base URL (可选):</label>
                <input type="text" id="model-baseUrl">

                <div class="form-buttons">
                    <button type="submit" class="button-primary">保存模型</button>
                    <button type="button" id="cancel-edit-btn" class="button">取消</button>
                </div>
            </form>
        </div>

        <div class="container">
            <h2>角色分配</h2>
            <div id="role-assignments">
                <!-- 角色分配将在此处动态生成 -->
            </div>
        </div>

        <div class="container">
            <h2>高级设置</h2>
            <div id="advanced-settings">
                <div class="setting-item">
                    <label for="setting-smart-scan">启用智能扫描 (按需读取文件):</label>
                    <input type="checkbox" id="setting-smart-scan">
                </div>
                <div class="setting-item">
                    <label for="setting-parallel-exec">启用并行任务执行:</label>
                    <input type="checkbox" id="setting-parallel-exec">
                </div>
                <div class="setting-item">
                    <label for="setting-auto-mode">启用自动模式 (无需手动批准):</label>
                    <input type="checkbox" id="setting-auto-mode">
                </div>
                <div class="setting-item">
                    <label for="setting-persistence">启用任务持久化 (可恢复任务):</label>
                    <input type="checkbox" id="setting-persistence">
                </div>
            </div>
        </div>

        <button id="save-settings-btn" class="button-primary">保存所有设置</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
