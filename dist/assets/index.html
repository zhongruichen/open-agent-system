<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多智能体任务状态</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>多智能体任务状态</h1>

    <div class="container">
        <div class="section">
            <h2>总体目标</h2>
            <p id="overall-goal">等待任务开始...</p>
        </div>

        <div class="section">
            <h2>当前计划</h2>
            <ul id="plan-list">
                <!-- 计划步骤将在此处动态插入 -->
            </ul>
        </div>

        <div class="section">
            <h2>执行日志</h2>
            <div id="execution-log" class="log-box">
                <!-- 日志消息将在此处动态插入 -->
            </div>
        </div>

        <div class="section">
            <h2>最终产物</h2>
            <pre id="final-artifact" class="code-box">
                <code><!-- 最终代码/产物将在此处显示 --></code>
            </pre>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
